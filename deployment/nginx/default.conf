server {
    listen 80;
    listen [::]:80;
    server_name payments.isbmcoe.in;

    # Certbot ACME Challenge path
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect HTTP to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name payments.isbmcoe.in;

    # SSL Certificates (managed via Certbot)
    ssl_certificate /etc/letsencrypt/live/payments.isbmcoe.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/payments.isbmcoe.in/privkey.pem;

    # Modern SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Maximum upload size for screenshots (15M)
    client_max_body_size 15M;

    # Proxy to Next.js App Container
    location / {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
